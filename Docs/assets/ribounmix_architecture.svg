<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1420" viewBox="0 0 1600 1420" role="img" aria-labelledby="title desc">
  <title id="title">RiboUnmix neural architecture and post-network equations</title>
  <desc id="desc">Two independent bidirectional GRU branches process sequence and dataset context. The biological branch produces a positive mean-one load. The dataset branch produces log-gamma and log-dispersion through feed-forward heads. Subsequent equations perform gamma centering, exponentiation, mass normalization, target-depth scaling, and NB2 parameterization.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="0.55" stop-color="#312e81"/>
      <stop offset="1" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="bioFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ecfdf5"/>
      <stop offset="1" stop-color="#d1fae5"/>
    </linearGradient>
    <linearGradient id="dataFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f3ff"/>
      <stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="eqFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBio" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#047857"/>
    </marker>
    <marker id="arrowData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6d28d9"/>
    </marker>
    <style>
      .sans{font-family:Inter,"Segoe UI",Arial,sans-serif;fill:#172033}
      .serif{font-family:"STIX Two Text","Cambria Math","DejaVu Serif",serif;fill:#111827}
      .title{font-size:34px;font-weight:750;letter-spacing:.2px}
      .subtitle{font-size:17px;fill:#dbeafe}
      .section{font-size:22px;font-weight:750;fill:#334155;letter-spacing:.3px}
      .lane{font-size:19px;font-weight:750}
      .block-title{font-size:18px;font-weight:750}
      .block-copy{font-size:15px;fill:#475569}
      .small{font-size:13px;fill:#64748b}
      .eq-title{font-size:18px;font-weight:750}
      .eq{font-size:19px}
      .eq-small{font-size:16px}
      .num{font-size:14px;font-weight:800;fill:#fff}
      .arrow{fill:none;stroke:#475569;stroke-width:3;marker-end:url(#arrow)}
      .arrow-bio{fill:none;stroke:#047857;stroke-width:3.5;marker-end:url(#arrowBio)}
      .arrow-data{fill:none;stroke:#6d28d9;stroke-width:3.5;marker-end:url(#arrowData)}
    </style>
  </defs>

  <rect width="1600" height="1420" rx="22" fill="#f8fafc"/>
  <rect x="0" y="0" width="1600" height="96" rx="22" fill="url(#header)"/>
  <rect x="0" y="72" width="1600" height="24" fill="url(#header)"/>
  <text x="54" y="47" class="sans title" style="fill:#fff">RiboUnmix architecture</text>
  <text x="55" y="76" class="sans subtitle">Learned blocks above · exact deterministic transformations below · active baseline configuration</text>

  <text x="50" y="132" class="sans section">A. Learned feature extractors and heads</text>

  <!-- Biological lane -->
  <rect x="36" y="151" width="1528" height="170" rx="18" fill="url(#bioFill)" stroke="#6ee7b7" stroke-width="2"/>
  <rect x="50" y="166" width="194" height="29" rx="14" fill="#047857"/>
  <text x="147" y="187" text-anchor="middle" class="sans lane" style="fill:#fff">BIOLOGICAL</text>

  <rect x="68" y="215" width="245" height="76" rx="12" fill="#fff" stroke="#34d399" stroke-width="2" filter="url(#shadow)"/>
  <text x="190" y="243" text-anchor="middle" class="sans block-title">Codon features x<tspan baseline-shift="sub" font-size="13">ti</tspan></text>
  <text x="190" y="267" text-anchor="middle" class="sans block-copy">97 one-hot channels</text>
  <text x="190" y="284" text-anchor="middle" class="sans small">+ routed biological features</text>

  <path d="M 313 253 L 365 253" class="arrow-bio"/>

  <rect x="366" y="204" width="275" height="98" rx="14" fill="#fff" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="503" y="234" text-anchor="middle" class="sans block-title">Biological BiGRU</text>
  <text x="503" y="259" text-anchor="middle" class="sans block-copy">2 layers · bidirectional</text>
  <text x="503" y="281" text-anchor="middle" class="sans block-copy">hidden size 256 / direction → 512</text>

  <path d="M 641 253 L 694 253" class="arrow-bio"/>

  <rect x="695" y="197" width="410" height="112" rx="14" fill="#fff" stroke="#10b981" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="900" y="224" text-anchor="middle" class="sans block-title">Positive local-factor FF</text>
  <text x="900" y="250" text-anchor="middle" class="sans block-copy">Linear 512→512 · GELU · Dropout</text>
  <text x="900" y="273" text-anchor="middle" class="sans block-copy">Linear 512→1 · Softplus</text>
  <text x="900" y="296" text-anchor="middle" class="sans small">strictly positive on valid positions</text>

  <path d="M 1105 253 L 1170 253" class="arrow-bio"/>

  <rect x="1172" y="211" width="185" height="84" rx="42" fill="#047857" filter="url(#shadow)"/>
  <text x="1264" y="246" text-anchor="middle" class="serif" font-size="25" style="fill:#fff">w<tspan baseline-shift="super" font-size="14">loc</tspan><tspan baseline-shift="sub" font-size="16">ti</tspan> &gt; 0</text>
  <text x="1264" y="274" text-anchor="middle" class="sans" font-size="14" style="fill:#d1fae5">raw local factor</text>

  <path d="M 1357 253 L 1412 253" class="arrow-bio"/>
  <rect x="1414" y="207" width="126" height="92" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2"/>
  <text x="1477" y="237" text-anchor="middle" class="sans" font-size="14" font-weight="700" style="fill:#065f46">NORMALIZE</text>
  <text x="1477" y="261" text-anchor="middle" class="serif" font-size="17">L<tspan baseline-shift="super" font-size="12">bio</tspan></text>
  <text x="1477" y="284" text-anchor="middle" class="sans small">mean = 1</text>

  <!-- Dataset lane -->
  <rect x="36" y="340" width="1528" height="345" rx="18" fill="url(#dataFill)" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="50" y="355" width="228" height="29" rx="14" fill="#6d28d9"/>
  <text x="164" y="376" text-anchor="middle" class="sans lane" style="fill:#fff">DATASET CONDITIONED</text>

  <rect x="64" y="405" width="238" height="62" rx="11" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="183" y="431" text-anchor="middle" class="sans block-title">Codon ID</text>
  <text x="183" y="452" text-anchor="middle" class="sans block-copy">embedding: 64→16</text>
  <rect x="64" y="481" width="238" height="72" rx="11" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="183" y="507" text-anchor="middle" class="sans block-title">Dataset ID d</text>
  <text x="183" y="529" text-anchor="middle" class="sans block-copy">centered embedding: 131→32</text>
  <text x="183" y="547" text-anchor="middle" class="sans small">E<tspan baseline-shift="sub" font-size="10">d</tspan> − mean<tspan baseline-shift="sub" font-size="10">ν</tspan>(E<tspan baseline-shift="sub" font-size="10">ν</tspan>)</text>
  <rect x="64" y="567" width="238" height="70" rx="11" fill="#fff" stroke="#a78bfa" stroke-width="2"/>
  <text x="183" y="594" text-anchor="middle" class="sans block-title">Optional bias features</text>
  <text x="183" y="617" text-anchor="middle" class="sans block-copy">0 channels in baseline</text>

  <path d="M 302 436 L 355 474" class="arrow-data"/>
  <path d="M 302 517 L 355 501" class="arrow-data"/>
  <path d="M 302 602 L 355 528" class="arrow-data"/>

  <rect x="356" y="448" width="148" height="90" rx="14" fill="#7c3aed" filter="url(#shadow)"/>
  <text x="430" y="483" text-anchor="middle" class="sans block-title" style="fill:#fff">CONCAT</text>
  <text x="430" y="508" text-anchor="middle" class="sans" font-size="15" style="fill:#ede9fe">48 channels</text>
  <text x="430" y="527" text-anchor="middle" class="sans" font-size="12" style="fill:#ddd6fe">baseline</text>

  <path d="M 504 493 L 552 493" class="arrow-data"/>
  <rect x="554" y="429" width="286" height="128" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="697" y="461" text-anchor="middle" class="sans block-title">Dataset-context BiGRU</text>
  <text x="697" y="487" text-anchor="middle" class="sans block-copy">2 layers · bidirectional</text>
  <text x="697" y="510" text-anchor="middle" class="sans block-copy">hidden size 128 / direction → 256</text>
  <text x="697" y="534" text-anchor="middle" class="sans block-copy">channel LayerNorm</text>

  <path d="M 840 493 L 892 493" class="arrow-data"/>
  <rect x="894" y="419" width="225" height="148" rx="14" fill="#fff" stroke="#8b5cf6" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1006" y="450" text-anchor="middle" class="sans block-title">Head features z<tspan baseline-shift="sub" font-size="12">dti</tspan></text>
  <text x="1006" y="478" text-anchor="middle" class="sans block-copy">dataset embedding 32</text>
  <text x="1006" y="501" text-anchor="middle" class="sans block-copy">local context 256</text>
  <text x="1006" y="524" text-anchor="middle" class="sans block-copy">position features 3</text>
  <line x1="926" y1="538" x2="1086" y2="538" stroke="#ddd6fe" stroke-width="2"/>
  <text x="1006" y="558" text-anchor="middle" class="sans" font-size="15" font-weight="700">total = 291</text>

  <path d="M 1119 470 C 1160 470 1160 430 1201 430" class="arrow-data"/>
  <path d="M 1119 516 C 1160 516 1160 586 1201 586" class="arrow-data"/>

  <rect x="1203" y="385" width="327" height="102" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1366" y="411" text-anchor="middle" class="sans block-title">Log-gamma FF head</text>
  <text x="1366" y="437" text-anchor="middle" class="sans block-copy">291→128→128→1</text>
  <text x="1366" y="459" text-anchor="middle" class="sans block-copy">GELU · dropout 0.1</text>
  <text x="1366" y="480" text-anchor="middle" class="serif" font-size="18">output: q<tspan baseline-shift="sub" font-size="12">dti</tspan></text>

  <rect x="1203" y="527" width="327" height="112" rx="14" fill="#fff" stroke="#7c3aed" stroke-width="2.5" filter="url(#shadow)"/>
  <text x="1366" y="554" text-anchor="middle" class="sans block-title">Log-dispersion FF head</text>
  <text x="1366" y="580" text-anchor="middle" class="sans block-copy">291→128→1 · GELU</text>
  <text x="1366" y="602" text-anchor="middle" class="sans block-copy">dropout 0.1</text>
  <text x="1366" y="626" text-anchor="middle" class="serif" font-size="17">output: log_sigma<tspan baseline-shift="sub" font-size="11">dti</tspan></text>

  <!-- Deterministic equations -->
  <text x="50" y="735" class="sans section">B. Operations after the learned blocks</text>

  <rect x="44" y="760" width="734" height="260" rx="18" fill="url(#eqFill)" stroke="#6ee7b7" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="76" cy="795" r="18" fill="#047857"/>
  <text x="76" y="800" text-anchor="middle" class="sans num">1</text>
  <text x="108" y="802" class="sans eq-title" style="fill:#065f46">Mean-one biological load and diagnostics</text>
  <text x="78" y="848" class="serif eq">w<tspan baseline-shift="super" font-size="11">loc</tspan><tspan baseline-shift="sub" font-size="13">ti</tspan> = softplus(FF<tspan baseline-shift="sub" font-size="13">bio</tspan>(BiGRU<tspan baseline-shift="sub" font-size="13">bio</tspan>(x)<tspan baseline-shift="sub" font-size="13">ti</tspan>))</text>
  <text x="78" y="892" class="serif eq">L<tspan baseline-shift="super" font-size="13">bio</tspan><tspan baseline-shift="sub" font-size="13">ti</tspan> = w<tspan baseline-shift="super" font-size="11">loc</tspan><tspan baseline-shift="sub" font-size="13">ti</tspan> / [ T<tspan baseline-shift="sub" font-size="13">t</tspan><tspan baseline-shift="super" font-size="13">−1</tspan> Σ<tspan baseline-shift="sub" font-size="13">j∈Vₜ</tspan> w<tspan baseline-shift="super" font-size="11">loc</tspan><tspan baseline-shift="sub" font-size="13">tj</tspan> ]</text>
  <text x="78" y="932" class="serif eq-small">mean<tspan baseline-shift="sub" font-size="11">i∈Vₜ</tspan>(L<tspan baseline-shift="super" font-size="11">bio</tspan><tspan baseline-shift="sub" font-size="11">ti</tspan>) = 1</text>
  <text x="78" y="963" class="serif eq-small">ρ<tspan baseline-shift="sub" font-size="11">ti</tspan> = L<tspan baseline-shift="super" font-size="10">bio</tspan><tspan baseline-shift="sub" font-size="10">ti</tspan>/(1+L<tspan baseline-shift="super" font-size="10">bio</tspan><tspan baseline-shift="sub" font-size="10">ti</tspan>)   ·   λ<tspan baseline-shift="sub" font-size="11">ti</tspan> = log(1+L<tspan baseline-shift="super" font-size="10">bio</tspan><tspan baseline-shift="sub" font-size="10">ti</tspan>)</text>
  <text x="78" y="985" class="serif eq-small">J<tspan baseline-shift="sub" font-size="11">t</tspan> = mean<tspan baseline-shift="sub" font-size="11">i∈Vₜ</tspan>(λ<tspan baseline-shift="sub" font-size="11">ti</tspan>)</text>
  <text x="78" y="1007" class="sans small">ρ, λ and J are diagnostics; only L<tspan baseline-shift="super" font-size="9">bio</tspan> enters the predicted mean.</text>

  <rect x="822" y="760" width="734" height="260" rx="18" fill="url(#eqFill)" stroke="#c4b5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="854" cy="795" r="18" fill="#6d28d9"/>
  <text x="854" y="800" text-anchor="middle" class="sans num">2</text>
  <text x="886" y="802" class="sans eq-title" style="fill:#5b21b6">Quality-weighted log-gamma centering</text>
  <text x="856" y="844" class="serif eq">ℓ<tspan baseline-shift="super" font-size="13">raw</tspan><tspan baseline-shift="sub" font-size="13">dti</tspan> = q<tspan baseline-shift="sub" font-size="13">dti</tspan> + log(γ<tspan baseline-shift="sub" font-size="13">init</tspan>)</text>
  <text x="856" y="885" class="serif eq-small">c<tspan baseline-shift="sub" font-size="11">ti</tspan> = [Σ<tspan baseline-shift="sub" font-size="11">d</tspan> w<tspan baseline-shift="super" font-size="11">(γ)</tspan><tspan baseline-shift="sub" font-size="11">d</tspan> · m<tspan baseline-shift="sub" font-size="11">dti</tspan>] / [Σ<tspan baseline-shift="sub" font-size="11">d</tspan> w<tspan baseline-shift="super" font-size="11">(γ)</tspan><tspan baseline-shift="sub" font-size="11">d</tspan>]  (≥2 datasets)</text>
  <text x="856" y="929" class="serif eq-small">ℓ<tspan baseline-shift="sub" font-size="11">dti</tspan> = ℓ<tspan baseline-shift="super" font-size="11">raw</tspan><tspan baseline-shift="sub" font-size="11">dti</tspan> − c<tspan baseline-shift="sub" font-size="11">ti</tspan>   ;   otherwise ℓ<tspan baseline-shift="sub" font-size="11">dti</tspan> = ℓ<tspan baseline-shift="super" font-size="11">raw</tspan><tspan baseline-shift="sub" font-size="11">dti</tspan></text>
  <text x="856" y="973" class="serif eq">γ<tspan baseline-shift="sub" font-size="13">dti</tspan> = exp(ℓ<tspan baseline-shift="sub" font-size="13">dti</tspan>) &gt; 0</text>
  <text x="856" y="1001" class="sans small">m averages duplicate rows within a dataset before each dataset receives one weighted vote.</text>

  <rect x="44" y="1048" width="734" height="250" rx="18" fill="url(#eqFill)" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="76" cy="1083" r="18" fill="#2563eb"/>
  <text x="76" y="1088" text-anchor="middle" class="sans num">3</text>
  <text x="108" y="1090" class="sans eq-title" style="fill:#1e40af">Target scale, multiplicative shape, mass gauge</text>
  <text x="78" y="1135" class="serif eq">S<tspan baseline-shift="sub" font-size="13">dt</tspan> = max(ε, T<tspan baseline-shift="sub" font-size="13">t</tspan><tspan baseline-shift="super" font-size="13">−1</tspan> Σ<tspan baseline-shift="sub" font-size="13">i∈Vₜ</tspan> y<tspan baseline-shift="sub" font-size="13">dti</tspan>)   ;   h<tspan baseline-shift="sub" font-size="13">dti</tspan> = γ<tspan baseline-shift="sub" font-size="13">dti</tspan>L<tspan baseline-shift="super" font-size="13">bio</tspan><tspan baseline-shift="sub" font-size="13">ti</tspan></text>
  <text x="78" y="1181" class="serif eq">h̃<tspan baseline-shift="sub" font-size="13">dti</tspan> = h<tspan baseline-shift="sub" font-size="13">dti</tspan> / [ T<tspan baseline-shift="sub" font-size="13">t</tspan><tspan baseline-shift="super" font-size="13">−1</tspan> Σ<tspan baseline-shift="sub" font-size="13">j∈Vₜ</tspan> h<tspan baseline-shift="sub" font-size="13">dtj</tspan> ]</text>
  <text x="78" y="1228" class="serif" font-size="24" font-weight="700">μ<tspan baseline-shift="sub" font-size="15">dti</tspan> = S<tspan baseline-shift="sub" font-size="15">dt</tspan> h̃<tspan baseline-shift="sub" font-size="15">dti</tspan></text>
  <text x="78" y="1268" class="sans block-copy">Exact consequence: mean<tspan baseline-shift="sub" font-size="11">i∈Vₜ</tspan>(μ<tspan baseline-shift="sub" font-size="11">dti</tspan>) = S<tspan baseline-shift="sub" font-size="11">dt</tspan>; observed mass is matched when target mean ≥ ε.</text>

  <rect x="822" y="1048" width="734" height="250" rx="18" fill="url(#eqFill)" stroke="#fbbf24" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="854" cy="1083" r="18" fill="#b45309"/>
  <text x="854" y="1088" text-anchor="middle" class="sans num">4</text>
  <text x="886" y="1090" class="sans eq-title" style="fill:#92400e">NB2 observation model</text>
  <text x="856" y="1134" class="serif eq-small">log α<tspan baseline-shift="sub" font-size="11">dti</tspan> = clip(log_sigma<tspan baseline-shift="sub" font-size="11">dti</tspan>, −5, 1)</text>
  <text x="856" y="1177" class="serif eq">α<tspan baseline-shift="sub" font-size="13">dti</tspan> = exp(log α<tspan baseline-shift="sub" font-size="13">dti</tspan>)</text>
  <text x="856" y="1220" class="serif eq">Y<tspan baseline-shift="sub" font-size="13">dti</tspan> ∼ NB2(μ<tspan baseline-shift="sub" font-size="13">dti</tspan>, α<tspan baseline-shift="sub" font-size="13">dti</tspan>)</text>
  <text x="856" y="1263" class="serif eq">Var(Y | μ, α) = μ + αμ²</text>
  <text x="856" y="1285" class="sans small">The public tensor name log_sigma is interpreted as NB2 log-dispersion log α by the loss.</text>

  <rect x="44" y="1324" width="1512" height="60" rx="15" fill="#172554"/>
  <text x="800" y="1350" text-anchor="middle" class="sans" font-size="17" font-weight="700" style="fill:#fff">Optimized profile objective</text>
  <text x="800" y="1374" text-anchor="middle" class="serif" font-size="17" style="fill:#dbeafe">ℒ = NB-NLL<tspan baseline-shift="sub" font-size="11">consensus</tspan> + 1.0 · ℒ<tspan baseline-shift="sub" font-size="11">PCC</tspan> + 0.2 · NB-NLL<tspan baseline-shift="sub" font-size="11">replica</tspan>   (current γ regularization weight = 0)</text>
</svg>
