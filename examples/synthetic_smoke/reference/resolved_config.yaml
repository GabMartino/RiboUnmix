        - 2
        minimum_group_size: 2
        median_group_size: 2.0
        mean_group_size: 2.0
        maximum_group_size: 2
        minimum_unique_transcripts_per_microbatch: 8
        median_unique_transcripts_per_microbatch: 8.0
        mean_unique_transcripts_per_microbatch: 8.0
        maximum_unique_transcripts_per_microbatch: 8
        selected_dataset_ids:
        - 0
