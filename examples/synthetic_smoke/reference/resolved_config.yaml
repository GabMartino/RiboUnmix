dataset_config:
  _name_: synthetic_smoke
  dataset_path:
    artificial_bias_5prime_aa: examples/synthetic_smoke/data/artificial_bias_5prime_aa.parquet
    artificial_bias_3prime_cc: examples/synthetic_smoke/data/artificial_bias_3prime_cc.parquet
name: ribounmix_synthetic_smoke
experiment:
  from_checkpoint: false
  train: true
  predict: true
  dataset:
  - artificial_bias_5prime_aa
  - artificial_bias_3prime_cc
  seed: 42
prediction:
  checkpoint_variants:
  - best_val_loss
split:
  master_dataset_universe: all
  validation_frac: 0.25
  validation_weight_bins: 4
paths:
  sequences_path: examples/synthetic_smoke/data/sequences.parquet
  checkpoints: outputs/synthetic_smoke/checkpoints
  logs: outputs/synthetic_smoke/logs
  results: outputs/synthetic_smoke/results
  encodings:
    nt: Datasets/encodings/nt_encoding.yaml
    codon_to_aa: Datasets/encodings/codon2aa.yaml
    codon: Datasets/encodings/codon_encoding.yaml
    aa: Datasets/encodings/aa_encoding.yaml
    datasets: Datasets/encodings/synthetic_dataset_encoding.yaml
data:
  batch_size: 8
  max_cds_codons: 240
  num_workers: 0
  predict_num_workers: 0
  multiprocessing_context: null
  train_sampling_strategy: transcript_grouped_multidataset_pairs
  minimum_positive_datasets_per_transcript: 2
  pin_memory: false
  prefetch_factor: null
  dataset_quality_ranking:
    path: ''
    dataset_column: dataset
    rank_column: quality_rank
    strict: false
training:
  execution_microbatching:
    enabled: true
    gradient_clip_val: 1.0
    gradient_clip_algorithm: norm
    max_pair_rows_per_forward: 16
    max_padded_codon_tokens_per_forward: 4000
    max_transcript_groups_per_forward: 8
  grouped_optimizer_batch:
    enabled: true
    target_unique_transcripts_per_optimizer_step: 8
    auto_accumulate_grad_batches: true
    accumulation_statistic: median
    max_accumulate_grad_batches: 8
    target_scope: per_rank
    log_batch_structure: true
    resolved:
      enabled: true
      configured_target_unique_transcripts: 8
      effective_local_target_unique_transcripts: 8
      target_scope: per_rank
      world_size: 1
      accumulation_statistic: median
      estimated_unique_transcripts_per_microbatch: 8.0
      resolved_accumulate_grad_batches: 1
      estimated_unique_transcripts_per_optimizer_step: 8.0
      estimated_global_unique_transcripts_per_optimizer_step: 8.0
      estimated_pair_rows_per_optimizer_step: 16.0
      microbatches_per_epoch_per_rank: 6
      estimated_optimizer_steps_per_epoch: 6
      expected_optimizer_steps_from_transcript_target: 6
      optimizer_step_expectation_ratio: 1.0
      accumulation_clamped_at_maximum: false
      physical_pair_microbatch_size: 16
      per_dataset_pair_microbatch_size: 8
      selected_dataset_count: 2
      estimated_global_pair_rows_per_optimizer_step: 16.0
      batch_statistics:
        iteration_index: 0
        number_of_microbatches: 6
        eligible_transcript_groups: 48
        physical_pair_capacity: 16
        pair_rows_per_microbatch:
        - 16
        - 16
