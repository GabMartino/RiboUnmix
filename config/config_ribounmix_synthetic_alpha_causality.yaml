defaults:
  - config_ribounmix_synthetic
  - _self_

# Controlled three-condition alpha-causality experiment. The launcher changes
# only loss.experiment_mode, loss.nb_mean_gradient_beta, model.alpha_mode, and
# the oracle value below. All other resolved settings are shared.
experiment:
  alpha_causality_group_id: null
  alpha_causality_condition: null

prediction:
  # Scientific comparisons use only the minimum-val-loss state.
  checkpoint_variants:
    - best_val_loss

model:
  mass_conservation: false
  alpha_mode: learned
  fixed_alpha: 0.1

loss:
  experiment_mode: standard_nb
  nb_mean_gradient_beta: 0.0
  nb_mean_gradient_max_weight: null

callbacks:
  early_stopping_patience: 20
  save_best_pcc_checkpoint: false
