name: ribo_queueing_multi_datasets

defaults:
  - dataset_config: datasets_paths
  - _self_

experiment:
  from_checkpoint: False
  train: True
  predict: True
  dataset: ["grimson_2019", "kutay_2021"]
  seed: 42
  split_size: 0.9

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"
  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"
  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 64
  num_workers: 4

  balanced_train_sampling: True
  dataset_balance_gamma: 1.0

  dataset_aware_batching: True
  datasets_per_batch: 2
  train_samples_per_epoch: null

model:
  biological_params:
    input_size: 97
    hidden_size: 256
    num_layers: 2
    dropout: 0.0
    w_temperature: 1.0

    # Recommended if you replaced entmax with softmax in the biological allocator.
    # Remove this key if your biological model does not read it.
    w_transform: softmax

  dataset_bias_params:
    position_features: ["rel_pos", "abs_pos_log", "start_window", "stop_window"]
    position_edge_tau: 30.0
    position_scale: 5000.0

    num_datasets: 33
    dataset_embeddings_size: 32

    num_codons: 64
    codon_embeddings_size: 32

    num_filters: 32
    kernel_size: 31

    dataset_multiplicative_bias_submodule_params:
      hidden_size: 128
      dropout: 0.0

      # Start conservative. Increase to 1.5 / 2.0 only after checking b_gain.
      log_b_max: 2.0
      tanh_temperature: 3.0

      # Gate parameters.
      gate_temperature: 2.0
      gate_threshold: 0.5
      init_keep_prob: 0.995

      # Keep train/validation consistent for now.
      hard_forward: false
      hard_eval: false

    dataset_additive_bias_submodule_params:
      hidden_size: 128
      dropout: 0.0
      use_entmax: False

      # Keep additive off until gate + b are understood.
      lambda_max: 0.0
      lambda_init: 0.01

    # It is used as kappa_input if loss.kappa_source is model_inverse/model_direct.
    dataset_dispersion_submodule_params:
      hidden_size: 128
      dropout: 0.0
      phi_min: 0.01
      phi_max: 100.0
      init_phi: 0.5

loss:
  type: dirichlet_multinomial_profile
  eps: 1.0e-8
  normalize_by_total: true
  include_multinomial_constant: false

  # For debugging, fixed kappa makes val_loss interpretable.
  # Once stable, switch to model_inverse if you want learned dataset uncertainty.
  kappa_source: fixed
  kappa: 500.0
  kappa_min: 1.0e-2
  kappa_max: 1.0e5
  pool_position_kappa: mean

  # Disable old Tweedie/NB options.
  nll_soft_cap: -1

  # Bias/gate regularization.
  lambda_bias_log_l2: 0.0
  lambda_bg_frac_l2: 0.0

optim:
  lr: 5.0e-4

  # Lower biological LR to reduce shared-L collapse risk.
  lr_biological: 5.0e-4
  lr_rest: 1.0e-3

  weight_decay: 1.0e-8

  use_pcgrad: True
  pcgrad_biology_only: true
  pcgrad_every_n_steps: 4
  pcgrad_alpha: 0.5
  pcgrad_rescale_to_mean_norm: true
  pcgrad_max_datasets_per_step: 2

  scheduler:
    monitor: val_mu_pcc
    mode: max
    factor: 0.9
    patience: 5
    min_lr: 1.0e-6

trainer:
  devices: [0]
  accelerator: gpu
  precision: 16-mixed
  accumulate_grad_batches: 1
  max_epochs: 200
  log_every_n_steps: 1

  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 10
  early_stopping_monitor: val_mu_pcc
  early_stopping_mode: max

metrics:
  grad_log_every_n_steps: 0

  css_recall_tolerance: 1
  css_peak_nms_radius: 1
  css_peak_top_frac: 0.02
  css_peak_min_peaks: 1
  css_peak_max_peaks: 50

  b_zero_eps: 1.0e-8
  b_high_threshold: 2.0
  R_support_eps: 1.0e-8

predict:
  example_idx: 0