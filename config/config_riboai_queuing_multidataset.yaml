name: ribo_queueing_multi_datasets

defaults:
  - dataset_config: datasets_paths
  - _self_

experiment:
  from_checkpoint: false
  train: true
  predict: true
  dataset: ["grimson_2019", "kutay_2021"]
  seed: 42
  split_size: 0.9

split:
  master_dataset_universe: ["grimson_2019", "kutay_2021"]
  train_frac: 0.88
  main_val_frac: 0.10
  css_benchmark_frac: 0.02

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"

  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"

  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 32
  num_workers: 4

  # Keep this for now to avoid confounding the architecture change
  # with the flat-pair objective.
  train_sampling_strategy: random_dataset_per_transcript

  balanced_train_sampling: false
  dataset_balance_gamma: 0.0

  dataset_aware_batching: false
  datasets_per_batch: 2
  train_samples_per_epoch: null

  pin_memory: true
  prefetch_factor: 4

model:
  biological_params:
    input_size: 97
    hidden_size: 256
    num_layers: 2
    dropout: 0.0

    # For the first ablation, softmax isolates the effect of the new
    # multiplicative observation bias. Switch to entmax15 later if you also
    # want true biological zeros.
    w_transform: softmax
    w_temperature: 1.0

    J_min: 1.0e-6
    J_max: 10.0

    # L = exp(h) - 1. h=8 gives L≈2980.
    hazard_max: 8.0

  dataset_bias_params:
    position_features: ["rel_pos", "abs_pos_log", "dist_to_start", "dist_to_stop", "start_window", "stop_window"]
    position_edge_tau: 30.0
    position_scale: 5000.0
    use_biological_context: false
    num_datasets: 33
    dataset_embeddings_size: 32

    num_codons: 64
    codon_embeddings_size: 32

    num_filters: 32
    kernel_size: 51

    # Active observation-bias branch:
    #
    #   b_raw_i = keep_gate_i * amp_i
    #   b_eff_i = b_raw_i / sum_j w_bio_j b_raw_j
    #   w_obs_i = w_bio_i * b_eff_i
    #
    # Therefore sum_i w_obs_i = 1.
    dataset_multiplicative_allocation_bias_submodule_params:
      hidden_size: 128
      dropout: 0.0

      amp_min: 0.0
      amp_max: 20.0
      amp_eps: 1.0e-8

      init_keep_prob: 0.001
      gate_temperature: 0.25
      gate_threshold: 0.5

      hard_forward: false
      hard_eval: true

    dataset_dispersion_submodule_params:
      hidden_size: 128
      dropout: 0.0
      phi_min: 0.01
      phi_max: 100.0
      init_phi: 0.5
loss:
  type: dirichlet_multinomial_profile
  eps: 1.0e-8
  normalize_by_total: true
  include_multinomial_constant: false

  dataset_balanced_loss: false

  # Kappa / overdispersion.
  kappa_source: model_inverse
  kappa: 500.0
  kappa_min: 1.0e-2
  kappa_max: 1.0e5
  kappa_scale: 100.0
  kappa_input_min: 1.0e-4
  pool_position_kappa: mean

  lambda_kappa_log_l2: 0.0
  kappa_reference: 500.0

  nll_soft_cap: -1

  # ------------------------------------------------------------
  # Single-score gated-amplitude observation bias
  # ------------------------------------------------------------
  # Regularizes the EFFECTIVE multiplicative correction:
  #
  #   b_eff_i =plitude observation bias
  # ------------------------------------------------------------
  # b_raw_i / sum_j w_bio_j b_raw_j
  #
  # not the raw beta/amp scale.
  #
  # Start more relaxed than 1e-3 because the previous model looked
  # under-capacitated / correction-limited.
  lambda_obs_bias_log_l2: 3.0e-4

  # Keep OFF for the single-score formulation.
  # Otherwise this fights low beta / suppression.
  lambda_obs_gate_open: 0.0

  # Keep OFF unless you use hard gates and see collapse.
  lambda_obs_gate_mean_floor: 0.0
  obs_gate_min_open: 0.90

  # Keep this. It prevents almost-unregularized corrections at positions
  # where w_bio is extremely small.
  obs_bias_uniform_weight: 0.05

optim:
  lr: 5.0e-4

  lr_biological: 5.0e-4
  lr_rest: 1.0e-3

  weight_decay: 1.0e-8

  use_pcgrad: false
  pcgrad_biology_only: true
  pcgrad_every_n_steps: 2
  pcgrad_alpha: 0.25
  pcgrad_rescale_to_mean_norm: true
  pcgrad_max_datasets_per_step: 2
  pcgrad_warmup_steps: 0

  scheduler:
    monitor: val_mu_pcc
    mode: max
    factor: 0.9
    patience: 5
    min_lr: 1.0e-6

trainer:
  devices: [0]
  accelerator: gpu
  precision: 16-mixed

  accumulate_grad_batches: 1
  max_epochs: 200
  log_every_n_steps: 1

  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 10
  early_stopping_monitor: val_mu_pcc
  early_stopping_mode: max

metrics:
  grad_log_every_n_steps: 0

  log_train_kappa: false
  log_example_plot: true

  log_css_recall: true
  css_recall_tolerance: 1
  css_z_thresholds: [1, 2, 3, 4, 5]
  css_z_eps: 1.0e-6

predict:
  example_idx: 0
  export_kappa: false
  export_all_extras: false