name: ribo_queueing_multi_datasets

defaults:
  # Use weighted_datasets_paths here to train with the optional parquet `weight`
  # column generated in Datasets/data/weighted_datasets_ribo_only_with_css.
  - dataset_config: weighted_datasets_paths
  - _self_

experiment:
  from_checkpoint: false
  train: true
  predict: true
  dataset: ["kutay_2021", "sako_2020"]
  seed: 42

split:
  master_dataset_universe: ["kutay_2021", "sako_2020", "kito_2023"]
  # Active training paths come from defaults.dataset_config. With
  # weighted_datasets_paths active, use the same weighted dataset config to
  # decide which transcript/dataset observations are eligible for validation and
  # split stratification. This keeps validation pair counts aligned with the
  # near-balanced weighted dataset sizes.
  source_dataset_config: weighted_datasets_paths
  restrict_val_pairs_to_split_source: true
  restrict_train_pairs_to_split_source: false
  include_experiment_only_train_ids: true
  train_frac: 0.8
  main_val_frac: 0.1
  css_benchmark_frac: 0.1

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"

  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"

  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 32
  num_workers: 4

  # transcript_grouped_pairs keeps the FULL datasets (single-dataset transcripts
  # included) while packing transcript groups into batches of batch_size.
  train_sampling_strategy: transcript_grouped_pairs
  dataset_balance_gamma: 0.0
  train_samples_per_epoch: null

  # Unused by transcript_grouped_pairs; only used by dataset_aware_balanced_pairs.
  datasets_per_batch: 2

  pin_memory: true
  prefetch_factor: 2

model:
  # --- Minimal queue-load model ---
  #   mu[d,t,i] = S[d,t] * L_bio[t,i] * beta[d,t,i]
  # S[d,t]     = mean over valid positions of the target (mean gauge, not learned)
  # L_bio[d,t,i] = expm1(J_dt * w_norm) = rho / (1 - rho)
  # J_dt       = J_t(sequence) * J_d(dataset), with J_d centered below.
  # beta       = exp(log_visibility_bias - beta_center_strength * center).
  #              beta_center_strength=1 hard-centers under detached L_bio
  #              weights, 0 leaves beta free but bounded.
  scale_gauge_mode: mean
  beta_center_strength: 1.0

  biological_params:
    input_size: 97
    hidden_size: 256
    num_layers: 2
    dropout: 0.0

    J_min: 1.0e-4
    J_max: 5.0
    init_J: 0.5
    lambda_bio_min: 1.0e-3
    lambda_bio_max: 3.0
    init_local_hazard_factor: 1.0
    init_local_hazard_weight_std: 1.0e-2

  # Dataset-level flux multiplier:
  #   J_dt = J_t * exp(log_J_d).
  # log_J_d is symmetrically centered over the active experiment datasets below.
  # Keep beta hard-centered when this is enabled; otherwise beta can absorb the
  # same mass degree of freedom as J_d.
  dataset_J_params:
    enabled: true
    init_log_J_dataset: 0.0
    # Symmetric, non-anchored gauge: center log_J_d over experiment.dataset ids
    # so active datasets have geometric-mean J_d = 1. This removes the global
    # J_t/J_d scale mode without choosing a reference dataset.
    center_strength: 1.0
    center_mode: active_configured
    log_J_dataset_max: 0.7

  dataset_bias_params:
    position_features:
      - rel_pos
      - start_window
      - stop_window

    position_edge_tau: 100.0
    position_scale: 5000.0

    num_datasets: 33
    dataset_embeddings_size: 32

    num_codons: 64
    codon_embeddings_size: 16

    use_local_context_cnn: true
    num_filters: 16
    kernel_size: 7
    context_cnn_dilations: [1, 2, 4, 8, 16]
    context_cnn_dropout: 0.1
    context_cnn_gated: false
    context_cnn_residual_scale: 1.0

    # Continuous visibility log-bias head: beta = exp(centered_log_bias).
    dataset_multiplicative_allocation_bias_submodule_params:
      hidden_size: 128
      dropout: 0.1
      log_bias_max: 2.5

    dataset_log_sigma_submodule_params:
      dataset_embedding_size: 16
      hidden_size: 128
      dropout: 0.1
      # Initial log_sigma head bias. 0.0 -> sigma = 1.
      init_log_sigma: 0.2
      # null -> learn per-position log_sigma.
      # Positive value -> bypass the sigma head and use this constant sigma.
      fixed_sigma: null

loss:
  # NB likelihood + soft mass regularization + configurable mu/y PCC loss:
  #   loss = NB_NLL + mass_loss_weight * mass_loss
  #        + effective_pcc_weight * pcc_loss
  # mass_loss = (log(mean_valid(mu)) - log(S))^2  (log-ratio of the means).
  mode: nb_plus_mass_plus_pcc
  profile_likelihood: negative_binomial

  eps: 1.0e-8
  mu_min: 1.0e-8
  mu_max: 100000000.0

  nb_log_alpha_min: -5.0
  nb_log_alpha_max: 3.0
  # Negative-binomial valid-position reduction inside each sequence:
  #   mean = average NLL over sequence length before aggregation
  #   sum  = sum NLL over sequence length, then aggregate across batch/datasets
  #   length_tempered = mean * clamp((valid_len/ref) ** (1-gamma), min, max)
  nb_sequence_reduction: length_tempered
  nb_length_temper_gamma: 0.75
  nb_length_temper_ref: 1000.0
  nb_length_temper_min_weight: 0.5
  nb_length_temper_max_weight: 2.0

  mass_loss_weight: 0.1
  mass_loss_type: log_mean_ratio

  pcc_loss_enabled: true
  pcc_loss_mode: hybrid_raw_nb_vst
  pcc_loss_weight: 1.0
  pcc_raw_component_weight: 0.2
  pcc_nb_vst_component_weight: 0.8
  pcc_loss_warmup_epochs: 5
  min_pcc_target_var: 1.0e-6
  pcc_mass_gate_tau: 0.25
  pcc_mass_gate_floor: 0.0
  pcc_reliability_min: 0.05
  pcc_reliability_max: 1.0
  pcc_alpha_min: 1.0e-5
  pcc_alpha_max: 20.0
  pcc_detach_alpha: true
  pcc_detach_reliability: true
  pcc_detach_mass_gate: true

  # Equal weight per dataset when combining per-sample losses.
  dataset_balanced_loss: true

  # Optional regularizers around the NB + mass + PCC objective.
  log_sigma_reg_weight: 0.0
  # Penalizes log(J_d)^2, so relative J_d deviations stay small.
  # The active_configured gauge above already removes the global J_d mode.
  J_dataset_reg_weight: 0.01
  # Penalize beta amplitude and local roughness in log-space. beta is still
  # hard mass-centered by model.beta_center_strength; these terms prevent the
  # dataset visibility branch from explaining profiles through sharp spikes.
  beta_l2_weight: 1.0e-4
  beta_tv_weight: 3.0e-4

gradient_conflict_diagnostics:
  enabled: true
  every_n_train_steps: 200
  max_batches_per_epoch: 5
  parameter_groups:
    - biological
    - rest
    - all
  include_pcc_in_dataset_loss: true
  include_mass_in_dataset_loss: true
  include_nll_in_dataset_loss: true
  component_modes:
    - full
  log_pairwise_matrix: true
  log_per_dataset_norms: true
  eps: 1.0e-12


cagrad:
  enabled: true
  apply_to: biological
  # CAGrad conflict-aversion coefficient, not a model scale parameter.
  c: 0.5
  num_weight_steps: 25
  weight_lr: 0.25
  rescale: c
  log_diagnostics: true
  eps: 1.0e-12

residual_diagnostics:
  enabled: true
  run_on_validation: true
  run_on_train: false

  eps: 1.0e-8
  eps_count: 1.0e-3

  zero_threshold: 0.0
  low_count_threshold: 1.0

  log_by_dataset: true
  log_by_length_bin: true
  log_by_position_bin: true
  log_by_mu_quantile: true
  log_by_target_quantile: true
  log_by_L_bio_quantile: true
  log_by_beta_quantile: true

  export_csv: true
  export_sample_csv: true
  export_dir: residual_diagnostics

  posterior_predictive_enabled: false
  posterior_predictive_samples: 20

  topk_fractions:
    - 0.01
    - 0.05
    - 0.10

  residual_tail_thresholds:
    - 2.0
    - 3.0
    - 5.0

optim:
  lr_biological: 5.0e-4
  lr_rest: 1.0e-3
  weight_decay_bio: 1.0e-2
  weight_decay_rest: 1.0e-3

  scheduler:
    monitor: val_pcc_value
    mode: max
    factor: 0.9
    patience: 1
    min_lr: 1.0e-6

trainer:
  devices: [0]
  accelerator: gpu
  precision: bf16-mixed
  use_distributed_sampler: false

  accumulate_grad_batches: 1
  max_epochs: 200
  log_every_n_steps: 1
  sync_dist_logs: false
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 25

metrics:
  log_train_per_dataset_metrics: true
  log_example_plot: true
  example_plot_max_datasets: 4
