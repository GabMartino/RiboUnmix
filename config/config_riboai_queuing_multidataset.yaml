name: ribo_queueing_multi_datasets

defaults:
  - dataset_config: datasets_paths
  - _self_

experiment:
  from_checkpoint: False
  train: True
  predict: True
  dataset: ["grimson_2019", "eichhorn_2014"]
  seed: 42
  split_size: 0.9

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"
  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"
  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 8
  num_workers: 4
  balanced_train_sampling: True
  dataset_balance_gamma: 1.0
  train_samples_per_epoch: null

model:
  biological_params:
    input_size: 97
    hidden_size: 256
    num_layers: 2
    dropout: 0.1
    w_temperature: 1.0

  dataset_bias_params:
    dataset_shift_submodule_params:
      num_datasets: 33
      shifts: [-1, 0, 1]
      temperature: 1.0
      init_strength: 1
      hard_eval: True
      straight_through_train: False

    dataset_multiplicative_bias_submodule_params:
      num_datasets: 33
      dataset_embeddings_size: 16
      num_codons: 64
      codon_embeddings_size: 16
      hidden_size: 128
      dropout: 0.0

    dataset_additive_bias_submodule_params:
      num_datasets: 33
      dataset_embeddings_size: 16
      num_codons: 64
      codon_embeddings_size: 16
      hidden_size: 128
      dropout: 0.0

    dataset_dispersion_submodule_params:
      num_datasets: 33
      dataset_embeddings_size: 16
      num_codons: 64
      codon_embeddings_size: 16
      hidden_size: 128
      dropout: 0.0
      phi_min: 0.02
      phi_max: 2.0

loss:
  eps: 1.0e-8
  censor_threshold: 0.0
  zero_censor_to_zero: True
  include_log_phi: True
  lambda_additive_l1: 0.05

optim:
  lr: 1.0e-3
  weight_decay: 1.0e-8

  use_pcgrad: True
  pcgrad_biology_only: true
  pcgrad_every_n_steps: 4
  pcgrad_alpha: 0.5
  pcgrad_rescale_to_mean_norm: true
  pcgrad_max_datasets_per_step: 2

  scheduler:
    monitor: val_loss
    mode: min
    factor: 0.9
    patience: 10
    min_lr: 1.0e-6

trainer:
  devices: [0]
  accelerator: gpu
  precision: 16-mixed
  accumulate_grad_batches: 1
  max_epochs: 300
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 25

predict:
  example_idx: 0