name: ribo_queueing_multi_datasets

defaults:
  - dataset_config: datasets_paths
  - _self_

experiment:
  from_checkpoint: false
  train: true
  predict: true
  dataset: ["kutay_2021"]
  seed: 42
  split_size: 0.9

split:
  master_dataset_universe: ["grimson_2019", "kutay_2021"]
  train_frac: 0.88
  main_val_frac: 0.10
  css_benchmark_frac: 0.02

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"

  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"

  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 32
  num_workers: 2

  train_sampling_strategy: dataset_aware_balanced_pairs
  dataset_balance_gamma: 1.0
  train_samples_per_epoch: null

  datasets_per_batch: 2

  pin_memory: false
  prefetch_factor: 2

model:
  # true = mu uses dataset/protocol heads:
  #   mu = scale_dt * support * beta
  # where support is rho or causal q depending on loss.pcc_target.
  use_dataset_bias: true

  biological_params:
    input_size: 97
    hidden_size: 256
    num_layers: 2
    dropout: 0.0

    J_min: 2.0e-2
    J_max: 8.0
    init_J: 0.5
    init_local_hazard_factor: 1.0
    hazard_max: 8.0
    rho_max: 1.0

  queue_propagation_params:
    # Overridden at startup from loss.pcc_target:
    #   rho -> false, raw occupancy prediction
    #   q   -> true, causal queue propagation prediction
    use_queue_propagation: true
    # Init near "no coupling" but with a live gradient. Do NOT use 0.0: at the
    # alpha_min boundary sigmoid'(raw) ~ 0, so alpha would be frozen there.
    queue_propagation_alpha: 0.5
    # Effective only when loss.pcc_target is q.
    queue_propagation_learnable: true
    queue_propagation_alpha_min: 0.0
    queue_propagation_alpha_max: 0.95
    queue_propagation_q_max: 10.0

  dataset_bias_params:
    position_features:
      - rel_pos
      - abs_pos_log
      - dist_to_start
      - dist_to_stop
      - start_window
      - stop_window

    position_edge_tau: 30.0
    position_scale: 5000.0

    num_datasets: 33
    dataset_embeddings_size: 48

    num_codons: 64
    codon_embeddings_size: 48

    num_filters: 64
    kernel_size: 15
    context_cnn_dilations: [1, 2, 4, 8, 16, 32]
    context_cnn_dropout: 0.05
    context_cnn_gated: true
    context_cnn_residual_scale: 1.0

    # Legacy key name; this is now a continuous visibility log-bias head.
    dataset_multiplicative_allocation_bias_submodule_params:
      hidden_size: 128
      dropout: 0.1
      log_bias_max: 2.0

    dataset_dropout_submodule_params:
      hidden_size: 96
      dropout: 0.05
      init_dropout_prob: 0.05
      logit_min: -8.0
      logit_max: null

    dataset_dispersion_submodule_params:
      hidden_size: 128
      dropout: 0.0
      phi_min: 0.001
      phi_max: 10.0
      init_phi: 0.5

    dataset_transcript_scale_factor_params:
      dataset_scale_embedding_size: 16
      hidden_size: 128
      dropout: 0.0

      log_global_scale_max: 3.0
      log_dataset_scale_max: 1.5
      log_transcript_scale_max: 3.0

      detach_context: true
      init_global_log_scale: 0.0

loss:
  # pcc_only, likelihood_only, or pcc_likelihood.
  # PCC is applied to rho/q support and observed mu_unconditional.
  # Likelihood is applied to full positive-component mu.
  mode: pcc_likelihood

  # Quantity correlated against the observed profile and used to set queue mode:
  #   rho = raw local occupancy, no causal propagation
  #   q   = occupancy after causal queue propagation
  pcc_target: q

  profile_likelihood: ziln
  # positive_mean reproduces the previous ZILN behavior; median decouples the
  # log-normal location from dispersion so phi changes do not shift the center.
  ziln_mu_parameterization: median
  zinb_target_transform: real
  zinb_zero_threshold: 0.0
  eps: 1.0e-8

  mu_min: 1.0e-8
  mu_max: 1.0e8

  phi_min: 0.001
  phi_max: 10.0

  log_sigma_min: 0.05
  log_sigma_max: 2.0

  censor_threshold: 0.5

  zero_fixed_prob: 0.001
  zero_input_is_logits: true
  phi_input_is_log: false
  detach_mu_for_zero_branch: false
  dataset_balanced_loss: true
  # Soft penalty on the batch-mean of log(J) drifting away from 0.
  # Prevents the J/scale_dt degeneracy (J→0, scale_dt→∞) while preserving
  # per-transcript J variation (the biological signal).
  j_centering_weight: 0.05

optim:
  lr: 5.0e-4
  lr_biological: 1.0e-4
  lr_rest: 2.0e-4
  weight_decay: 1.0e-8

  use_cagrad: false
  cagrad_alpha: 0.5
  cagrad_iterations: 25
  cagrad_rescale_to_mean_norm: true

  scheduler:
    monitor: val_mu_unconditional_pcc
    mode: max
    factor: 0.9
    patience: 5
    min_lr: 1.0e-6

trainer:
  devices: [0]
  accelerator: gpu
  precision: 32-true

  accumulate_grad_batches: 1
  max_epochs: 200
  log_every_n_steps: 1
  sync_dist_logs: false
  gradient_clip_val: 0.5
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 10

metrics:
  log_example_plot: true
  example_plot_max_datasets: 4
