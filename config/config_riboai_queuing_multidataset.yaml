defaults:
  - dataset_config: preprocessed_datasets_ribo_only
  - _self_

experiment:
  from_checkpoint: False
  train: True
  predict: True
  dataset: ["kutay_2021", "grimson_2019", "cui_2024", "gillen_2019", "martinez_2019", "iwasaki_2020", "kito_2023", "volegova_2018"]
  seed: 42
  split_size: 0.9

paths:
  sequences_path: "./Datasets/data/sequence/sequence_embeddings_with_css.parquet"
  css_split: "./Datasets/data/sequence/css_split.json"
  checkpoints: "./checkpoints/riboai_queueing"
  logs: "./logs/riboai_queueing"
  results: "./results/riboai_queueing"
  encodings:
    nt: "Datasets/encodings/nt_encoding.yaml"
    codon_to_aa: "Datasets/encodings/codon2aa.yaml"
    codon: "Datasets/encodings/codon_encoding.yaml"
    aa: "Datasets/encodings/aa_encoding.yaml"
    datasets: "Datasets/encodings/dataset_encoding.yaml"

data:
  batch_size: 64
  num_workers: 8

model:
  input_size: 97
  hidden_dims: 256
  num_layers: 2
  dropout: 0.1
  w_temperature: 1.0
  rho_eps: 1e-6
  log_sigma_min: -4.0  # Fixed name
  log_sigma_max: 1.0   # Fixed name
  num_datasets: 32

sigma:
  freeze_epochs: 0

loss:
  eps: 1e-6
  censor_threshold: 0.0000001 # Extremely low threshold!

metrics:
  S_quantile: 0.99
  S_eps: 1e-6
  S_use_nonzero_only: true
  S_use_censor_threshold: true

optim:
  lr: 1e-3
  weight_decay: 1e-3
  scheduler:
    name: reduce_on_plateau
    monitor: val_loss_epoch
    mode: min
    factor: 0.9
    patience: 1
    min_lr: 1e-6

trainer:
  devices: [0, 1]
  accelerator: gpu
  precision: bf16-mixed
  accumulate_grad_batches: 2
  max_epochs: 300
  log_every_n_steps: 1
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

callbacks:
  early_stopping_patience: 15

predict:
  example_idx: 0